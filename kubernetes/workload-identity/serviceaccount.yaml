# =============================================================================
# kubernetes/workload-identity/serviceaccount.yaml
# =============================================================================
#
# Namespace, ServiceAccount and sample Deployment for the Azure AD Workload
# Identity demo described in architecture.md section 3
# (../../docs/architecture.md#3-workload-identity-token-exchange).
#
# This file is a TEMPLATE. The one placeholder it contains --
# "<AZURE_CLIENT_ID>" -- is not a secret, but it does not exist until
# `terraform apply` has run: it is the client ID of the
# azurerm_user_assigned_identity that modules/identity creates for this
# workload, keyed by name in that module's map input. It is surfaced as the
# Terraform output `workload_identity_client_ids["demo-app"]` (see
# modules/identity/outputs.tf and envs/<env>/outputs.tf), the same value
# consumed by kubernetes/secrets-store/secretproviderclass.yaml.
#
# Populate it the same way getting-started.md Step 11 does -- a literal
# string substitution against this file -- rather than hand-editing a copy:
#
#   PowerShell:
#     $cid = terraform -chdir=envs/dev output -raw workload_identity_client_id
#     (Get-Content .\kubernetes\workload-identity\serviceaccount.yaml) `
#       -replace '<AZURE_CLIENT_ID>', $cid | kubectl apply -f -
#
#   bash:
#     cid="$(terraform -chdir=envs/dev output -raw workload_identity_client_id)"
#     sed "s/<AZURE_CLIENT_ID>/${cid}/" kubernetes/workload-identity/serviceaccount.yaml \
#       | kubectl apply -f -
#
# In CI this same substitution is done by a small templating step (envsubst
# or a Helm `values.yaml` render) that runs after `terraform apply` and before
# `kubectl apply` -- see kubernetes/README.md "Apply order".
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    # Plain descriptive label, not a Workload Identity control. The
    # azure.workload.identity/use label matters only on the POD template
    # below -- see the comment on the Deployment's spec.template.metadata.
    purpose: demo-workloads

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: apps
  annotations:
    # This annotation is what the Workload Identity mutating webhook reads to
    # decide WHICH Azure identity a pod using this ServiceAccount should
    # impersonate. It must be the CLIENT ID (not the object ID, not the
    # principal ID) of the azurerm_user_assigned_identity created by
    # modules/identity for the "demo-app" key -- i.e.
    # module.identity.client_ids["demo-app"] in envs/<env>/main.tf.
    #
    # Populated from CI/templating -- see the file header above. Left as a
    # literal placeholder here so this manifest is deployable as a template,
    # not a secret-bearing file: a client ID is a public identifier, not a
    # credential (same reasoning as docs/architecture.md
    # #why-repository-variables-not-secrets).
    azure.workload.identity/client-id: "<AZURE_CLIENT_ID>"
  labels:
    # Informational on the ServiceAccount itself -- some tooling and the
    # `azwi` CLI look for it here for discovery, but it has NO admission-time
    # effect. The webhook only acts on the label carried by the POD (see
    # below). Do not rely on this label alone to get token injection.
    azure.workload.identity/use: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: apps
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        # ---------------------------------------------------------------
        # THIS is the label that matters. The Workload Identity mutating
        # admission webhook (enabled by `workload_identity_enabled = true`
        # on the AKS cluster, see modules/aks) inspects POD admission
        # requests, not Deployment objects. A label here on
        # spec.template.metadata.labels gets copied onto every Pod the
        # ReplicaSet creates, and THAT is what the webhook sees.
        #
        # Putting `azure.workload.identity/use: "true"` on the Deployment's
        # own `metadata.labels` (the top-level one, outside `spec.template`)
        # does nothing at all -- no error, no warning, the pod simply never
        # gets the projected token volume or the AZURE_* environment
        # variables, and the first symptom is usually a confusing
        # "DefaultAzureCredential failed to retrieve a token" from inside the
        # container. This exact mistake is documented in
        # ../../docs/architecture.md#the-two-failure-modes-you-will-actually-hit.
        # ---------------------------------------------------------------
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: demo-app
      # Explicit even though true is the Kubernetes default: the Workload
      # Identity projected-token volume is mounted via the ServiceAccount's
      # token projection mechanism, and an explicit `true` here makes the
      # dependency obvious to a reader rather than relying on an implicit
      # default that someone could "clean up" later.
      automountServiceAccountToken: true
      containers:
        - name: demo-app
          # Minimal public placeholder image. Swap for your own workload --
          # the only contract this manifest relies on is that the container
          # process reads AZURE_CLIENT_ID / AZURE_TENANT_ID /
          # AZURE_FEDERATED_TOKEN_FILE (injected by the webhook) via the
          # Azure SDK's DefaultAzureCredential, and/or reads files under
          # /mnt/secrets-store.
          image: mcr.microsoft.com/azuredocs/azure-vote-front:v1
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # Populated by the Secrets Store CSI driver per the
            # SecretProviderClass in
            # ../secrets-store/secretproviderclass.yaml. File-mount is the
            # preferred consumption pattern -- see the comment there on why
            # the optional secretObjects sync-as-Secret block is NOT used by
            # this container.
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            # Generous on purpose. Entra ID role assignment propagation
            # (the Key Vault Secrets User grant the managed identity needs)
            # is eventually consistent and can take 30-60 seconds after
            # `terraform apply` completes -- see
            # ../../docs/architecture.md#ordering-constraints-that-are-real.
            # A pod that starts probing immediately and fails fast can be
            # killed and restarted into a crash-loop before that propagation
            # finishes, even though nothing is actually wrong. 60s here plus
            # the probe's own retry budget rides out that window instead of
            # fighting it.
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            # Same Entra propagation rationale as the liveness probe above:
            # do not mark the pod Ready (and start receiving Service traffic)
            # before the CSI mount and any Key Vault-backed secret read had a
            # realistic chance to succeed.
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: demo-app-secrets
