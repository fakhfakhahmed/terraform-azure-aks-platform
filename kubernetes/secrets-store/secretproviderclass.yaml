# =============================================================================
# kubernetes/secrets-store/secretproviderclass.yaml
# =============================================================================
#
# Tells the Secrets Store CSI driver (installed on the cluster via the AKS
# `key_vault_secrets_provider` add-on -- see modules/aks, and the CSI node
# running in `secret_rotation_enabled` mode) which Key Vault to read from,
# which secrets to fetch, and which Azure identity to authenticate as.
#
# This is a TEMPLATE, same as
# ../workload-identity/serviceaccount.yaml: three placeholders --
# "<AZURE_CLIENT_ID>", "<KEY_VAULT_NAME>", "<AZURE_TENANT_ID>" -- are filled
# in after `terraform apply`, from Terraform outputs, by the same
# envsubst/Helm-values/CI-templating step described in
# ../README.md#apply-order. None of the three is a secret: a client ID, a
# vault name and a tenant ID are all public identifiers (same reasoning as
# docs/architecture.md#why-repository-variables-not-secrets). What actually
# authorises the read is the federated identity credential Terraform created
# for this workload, resolved at runtime via the projected Workload Identity
# token -- see docs/architecture.md section 3.
#
# This object is NAMESPACED. It must live in the same namespace as the pods
# that reference it (`apps`), per
# docs/getting-started.md#troubleshooting -- "Pod stuck in ContainerCreating,
# event says failed to get secretproviderclass" is almost always a namespace
# mismatch between this file and the Deployment.
# =============================================================================

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-app-secrets
  namespace: apps
spec:
  provider: azure
  parameters:
    # Both of these MUST be "false" for Workload Identity. They exist to
    # select Azure AD Pod Identity (deprecated, see ADR-0004) or the node's
    # VM-assigned managed identity instead -- leaving either unset lets the
    # provider fall back to a different, wrong auth mode, which is failure
    # mode #3 in docs/getting-started.md#troubleshooting.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    # The Workload Identity client ID. This MUST be the same identity as the
    # one annotated on the ServiceAccount in
    # ../workload-identity/serviceaccount.yaml --
    # module.identity.client_ids["demo-app"]. The CSI driver presents the
    # pod's projected service account token as a client assertion for THIS
    # client ID; if the two files are templated from different identities,
    # or either is stale, Entra returns AADSTS70021 (no matching federated
    # identity record), surfaced by the driver as a mount failure.
    clientID: "<AZURE_CLIENT_ID>"

    # Key Vault to read from -- the vault's short name (not a full URL), e.g.
    # the Terraform output `key_vault_name` from envs/<env>/outputs.tf.
    keyvaultName: "<KEY_VAULT_NAME>"

    tenantId: "<AZURE_TENANT_ID>"

    # Objects to fetch, expressed as a YAML array *encoded as a string* --
    # this is a quirk of the provider's parameter schema, not a mistake: the
    # CSI driver parses this value as its own nested YAML document.
    objects: |
      array:
        - |
          objectName: demo-secret
          objectType: secret
        - |
          objectName: demo-connection-string
          objectType: secret

  # -----------------------------------------------------------------------
  # Optional: sync-as-Kubernetes-Secret.
  # -----------------------------------------------------------------------
  # The CSI driver always materialises the objects above as files under
  # /mnt/secrets-store in any pod that mounts this SecretProviderClass (see
  # ../workload-identity/serviceaccount.yaml). That file-mount is the
  # PREFERRED consumption pattern: the driver's `secret_rotation_enabled`
  # polling re-reads the vault and updates the file in place, so a rotated
  # secret reaches the pod without a restart, and the value never passes
  # through the Kubernetes API server or etcd.
  #
  # `secretObjects` below is the opt-in "sync as Secret" escape hatch, for
  # the case where an application genuinely cannot be changed to read a
  # file -- e.g. a third-party container image that only reads an
  # environment variable at startup. It is included here for completeness
  # and left UNUSED by the sample Deployment (which reads the mounted
  # files). Two costs come with using it:
  #   1. the value is copied into a real Kubernetes Secret object (base64 in
  #      etcd, or plaintext if the cluster is not using encryption-at-rest
  #      for Secrets), reintroducing exactly the "secret living in the
  #      cluster" exposure Workload Identity + CSI was adopted to avoid;
  #   2. rotation stops being automatic -- the CSI driver updates the Secret
  #      object on its poll interval, but a pod consuming it as an env var
  #      (rather than a re-mounted file) will not see the new value until it
  #      restarts, because env vars are resolved once at container start.
  # Prefer the file mount. Use this block only when you have written down
  # why the file mount will not work for the specific workload.
  # -----------------------------------------------------------------------
  secretObjects:
    - secretName: demo-app-secrets-synced
      type: Opaque
      data:
        - objectName: demo-secret
          key: DEMO_SECRET
